# A self-hosted GitHub Actions runner for one repository, as Linux containers on the machine (README.md, "CI").
# `factory ci` brings up a new project for each job (its name comes from the project: `<name>`), the runner
# takes one job (--ephemeral), and `down -v` removes both containers and every volume before the next one.

services:
  # The job's own Docker (Docker-in-Docker): the job's service containers (its Postgres) start here,
  # not in the machine's Docker, and their ports stay inside. Privileged, so not a security boundary
  # (README.md, "CI": the known risk).
  dind:
    image: docker:${DIND_VERSION:-29.2.0}-dind
    privileged: true
    # Only a unix socket, shared with the runner: no TCP port, so nothing else can reach this daemon.
    # Group 123 is the docker group of the runner image, so its non-root user can use the socket.
    command: ['dockerd', '--host=unix:///run/dind/docker.sock', '--group=123']
    environment:
      DOCKER_TLS_CERTDIR: ''
    volumes:
      - dind-socket:/run/dind
      - dind-data:/var/lib/docker
    healthcheck:
      test: ['CMD', 'docker', '--host=unix:///run/dind/docker.sock', 'info']
      interval: 2s
      timeout: 5s
      retries: 30

  runner:
    image: ghcr.io/actions/actions-runner:${RUNNER_VERSION:-2.338.0}
    # The runner shares dind's network, so a service port published by a job (`ports: - 5432`) is on
    # the runner's localhost, as on GitHub's runners, and never on the machine.
    network_mode: service:dind
    depends_on:
      dind:
        condition: service_healthy
    # The image's user is `runner` (uid 1001), not root.
    entrypoint: ['/bin/bash', '/opt/factory-ci/entrypoint.sh']
    # Chrome (browser tests, Lighthouse) needs more shared memory than Docker's 64 MB.
    shm_size: 1gb
    environment:
      DOCKER_HOST: unix:///run/dind/docker.sock
      RUNNER_REPO: ${RUNNER_REPO:?}
      RUNNER_NAME: ${RUNNER_NAME:?}
      RUNNER_LABEL: ${RUNNER_LABEL:?}
      # No value here: taken from the loop's environment for this one `up`, never from a file.
      RUNNER_TOKEN:
    volumes:
      - ./entrypoint.sh:/opt/factory-ci/entrypoint.sh:ro
      - dind-socket:/run/dind

volumes:
  dind-socket:
  dind-data:
